# Primary workstation local Sway overrides.
#
# This file is versioned as an opt-in preset for the repository's primary user.
# It is not included by the base config directly; enable it from local.conf.

# Personal app shortcuts.
bindsym $mod+Shift+space exec ~/.config/scripts/launch_on_workspace.sh "$ws9" '^handy$' handy
bindsym Mod4+semicolon exec pkill -USR2 -x handy
bindsym $mod+Ctrl+s exec ~/.config/scripts/launch_on_workspace.sh "$ws9" '^localsend$' gtk-launch org.localsend.localsend_app

# Personal utility app autostart.
exec --no-startup-id ~/.config/scripts/launch_on_workspace.sh "$ws9" '^handy$' handy
exec --no-startup-id ~/.config/scripts/launch_on_workspace.sh "$ws9" '^ch\.proton\.bridge-gui$' gtk-launch ch.protonmail.protonmail-bridge
exec --no-startup-id ~/.config/scripts/launch_on_workspace.sh "$ws9" '^pcloud$' gtk-launch appimagekit-pcloud
exec --no-startup-id ~/.config/scripts/launch_on_workspace.sh "$ws9" '^localsend$' gtk-launch org.localsend.localsend_app

# Dell U2719D and U2724D workstation layout.
output DP-3 resolution 2560x1440@60Hz position 2560,0
output HDMI-A-1 resolution 2560x1440@60Hz position 0,0

# Workspace 9 utility apps.
assign [app_id="^handy$"] 9:
assign [app_id="^ch\.proton\.bridge-gui$"] 9:
assign [app_id="^localsend$"] 9:
assign [app_id="^pcloud$"] 9:
for_window [app_id="^handy$"] move container to workspace 9:, floating enable, resize set 960 665, move position 23 730
for_window [app_id="^ch\.proton\.bridge-gui$"] move container to workspace 9:, floating enable, resize set 1084 663, move position 449 54
for_window [app_id="^localsend$"] move container to workspace 9:, floating enable, resize set 408 658, move position 20 56
for_window [app_id="^pcloud$"] move container to workspace 9:, floating enable, resize set 804 664, move position 998 729
